[general]
import = ["os.toml"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 1.0
blur = true

[font]
size = 14.5

[font.normal]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Bold"

# Spectere
[colors.primary]
background = "#060C06"
foreground = "#55BB55"
dim_foreground = "#1A3018"
bright_foreground = "#77DD77"

[colors.cursor]
text = "#060C06"
cursor = "#55BB55"

[colors.vi_mode_cursor]
text = "#060C06"
cursor = "#338833"

[colors.selection]
text = "CellForeground"
background = "#0A1A0A"

# Default plain text uses primary.foreground (green).
# Apps like chalk use this 16-color ANSI palette — keep hues distinct.
[colors.normal]
black = "#060C06"
red = "#DD4444"
green = "#55BB55"
yellow = "#D4A017"
blue = "#4A8FBF"
magenta = "#B060A0"
cyan = "#3A9A8A"
white = "#A8B8A8"

[colors.bright]
black = "#1A3018"
red = "#FF6666"
green = "#77DD77"
yellow = "#E8C040"
blue = "#6AB0D8"
magenta = "#D080C0"
cyan = "#50C0B0"
white = "#D0E0D0"

[colors.dim]
black = "#060C06"
red = "#882222"
green = "#1A3018"
yellow = "#6A5010"
blue = "#254860"
magenta = "#583050"
cyan = "#1D4D45"
white = "#4A5A4A"

[cursor]
style = { shape = "Beam", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https?://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\\\s{-}\\\\^⟨⟩`\\\\]]+"
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }

[[hints.enabled]]
regex = "[a-zA-Z0-9_./-]+:\\d+(?::\\d+)?"
command = { program = "sh", args = ["-c", "IFS=: read -r f l c <<EOF; exec nvim \"+$l\" \"$f\"\n$1\nEOF", "hint"] }
post_processing = false
persist = false
binding = { key = "F", mods = "Control|Shift" }

[keyboard]
bindings = [
  # { key = "V", mods = "Control", chars = "\u0016" }, # Send Ctrl+V
  # { key = "V", mods = "Control", action = "None" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]
