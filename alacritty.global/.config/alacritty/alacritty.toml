[general]
import = ["os.toml"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.95
blur = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[cursor]
style = { shape = "Beam", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https?://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\\\s{-}\\\\^⟨⟩`\\\\]]+"
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }

[[hints.enabled]]
regex = "[a-zA-Z0-9_./-]+:\\d+(?::\\d+)?"
command = { program = "sh", args = ["-c", "IFS=: read -r f l c <<EOF; exec nvim \"+$l\" \"$f\"\n$1\nEOF", "hint"] }
post_processing = false
persist = false
binding = { key = "F", mods = "Control|Shift" }

[keyboard]
bindings = [
  { key = "V", mods = "Control", action = "None" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]
