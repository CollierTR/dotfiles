# General settings
[general]
import = [] # Add external theme file paths here if desired

# Window configuration
[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.95
blur = true

# Font settings
[font]
size = 11.0

[font.normal]
family = "Consolas" # Replace with "Cascadia Code", "Fira Code", etc.
style = "Regular"

[font.bold]
family = "Consolas"
style = "Bold"

# Default Shell Selection (Uncomment only ONE option below)

# Option A: PowerShell Core (Recommended)
#[shell]
#program = "pwsh.exe"

# Option B: Windows PowerShell (Default)
#[shell]
#program = "powershell.exe"

# Option C: WSL (Ubuntu or default Linux distro)
[shell]
program = "wsl.exe"
args = ["~"]
