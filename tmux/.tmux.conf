set -g mouse on
set -sg escape-time 1

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key , command-prompt -I "#W" "rename-window '%%'; setw automatic-rename off"

##### =========================
##### TERMINAL FIXES
##### =========================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

##### =========================
##### SPECTERE THEME
##### =========================

set -g status-position top

set -g mode-style "fg=#060C06,bg=#55BB55"

set -g message-style "fg=#060C06,bg=#55BB55"
set -g message-command-style "fg=#060C06,bg=#55BB55"

set -g pane-border-style "fg=#1A3018"
set -g pane-active-border-style "fg=#55BB55"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#55BB55,bg=#081008"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#060C06,bg=#55BB55,bold] #S #[fg=#55BB55,bg=#081008,nobold] "
set -g status-right "#[fg=#77DD77,bg=#081008] %Y-%m-%d %H:%M #[fg=#060C06,bg=#55BB55,bold] #h "

setw -g window-status-activity-style "fg=#77DD77,bg=#081008"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#1A3018,bg=#081008"
setw -g window-status-format "#[fg=#1A3018,bg=#081008] #I #W "
setw -g window-status-current-format "#[fg=#060C06,bg=#55BB55,bold] #I #W "

set -g clock-mode-colour "#55BB55"
set -g copy-mode-match-style "fg=#060C06,bg=#55BB55"
set -g copy-mode-current-match-style "fg=#060C06,bg=#77DD77"

##### =========================
##### INDEXING (1-based)
##### =========================
set -g base-index 1
set -g pane-base-index 1

##### =========================
##### AUTO WINDOW NAMING
##### =========================
setw -g automatic-rename on
##setw -g automatic-rename-format '#{pane_current_command}'
set -g automatic-rename-format ' #{pane_current_command} '

##### =========================
##### SPLITS AND WINDOWS
##### =========================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

##### =========================
##### VIM-STYLE NAVIGATION
##### =========================
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

##### =========================
##### PERSISTENT RENAMING
##### =========================
bind-key , command-prompt -I "#W" "rename-window '%%'; setw automatic-rename off"

# Vim mode cursor change
set -as terminal-features ',xterm-256color:extkeys'
set -ga terminal-overrides ',xterm-256color:Ss=\E[%p1%d q:Se=\E[2 q'

##### =========================
##### PLUGINS
##### =========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'

# Initialize TMUX plugin manager (keep this at bottom)
run '~/.tmux/plugins/tpm/tpm'

